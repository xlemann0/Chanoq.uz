{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl mt-12">
    <h2 class="text-2xl font-bold text-center mb-6 text-white">Ro'yxatdan o'tish</h2>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm text-slate-400 mb-1">Foydalanuvchi nomi</label>
            <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">Parol</label>
            <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition">Ro'yxatdan o'tish</button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-4">Allaqachon hisobingiz bormi? <a href="{{ url_for('login') }}" class="text-blue-400 hover:underline">Kirish</a></p>
</div>
{% endblock %}
