{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white border border-slate-200 p-8 rounded-2xl shadow-xl mt-6">
    <h2 class="text-2xl font-bold text-slate-900 mb-2">Yangi E'lon Qo'shish</h2>
    <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl mb-6 text-blue-900 text-sm">
        <p class="font-bold mb-1">E'lon joylash narxi: 20 000 so'm</p>
        <p>Quyidagi kartaga to'lovni amalga oshiring va chek rasmini yuklang:</p>
        <p class="font-mono bg-white px-3 py-1.5 rounded-lg mt-2 text-blue-600 font-bold border border-blue-100 select-all">9860 1701 0945 5106 (Raxmatillayev Dilshod)</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        <div>
            <label class="block text-sm text-slate-600 mb-1">E'lon sarlavhasi</label>
            <input type="text" name="title" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-slate-600 mb-1">Kategoriya</label>
                <select name="category" id="categorySelect" onchange="updateSubcategories()" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600">
                    <option value="">Kategoriyani tanlang</option>
                    {% for cat in categories.keys() %}
                        <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-600 mb-1">Kichik bo'lim</label>
                <select name="subcategory" id="subcategorySelect" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600">
                    <option value="">Avval kategoriyani tanlang</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-slate-600 mb-1">Hududni tanlang</label>
                <select name="region" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600">
                    <option value="Toshkent sh.">Toshkent sh.</option>
                    <option value="Toshkent vil.">Toshkent vil.</option>
                    <option value="Samarqand">Samarqand</option>
                    <option value="Buxoro">Buxoro</option>
                    <option value="Farg'ona">Farg'ona</option>
                    <option value="Andijon">Andijon</option>
                    <option value="Namangan">Namangan</option>
                    <option value="Qashqadaryo">Qashqadaryo</option>
                    <option value="Surxondaryo">Surxondaryo</option>
                    <option value="Jizzax">Jizzax</option>
                    <option value="Sirdaryo">Sirdaryo</option>
                    <option value="Navoiy">Navoiy</option>
                    <option value="Xorazm">Xorazm</option>
                    <option value="Qoraqalpog'iston">Qoraqalpog'iston</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-600 mb-1">Narxi (so'mda)</label>
                <input type="text" name="price" placeholder="Masalan: 85000000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600">
            </div>
        </div>

        <div>
            <label class="block text-sm text-slate-600 mb-1">Oylik maosh (Agar ish bo'lsa, masalan: 500$ yoki 4,000,000 so'm)</label>
            <input type="text" name="salary" placeholder="Ixtiyoriy" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600">
        </div>

        <div>
            <label class="block text-sm text-slate-600 mb-1">Batafsil ma'lumot (Model, rang, yil, talablar va h.k.)</label>
            <textarea name="details" rows="4" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-slate-600 mb-1">Aloqa raqami</label>
                <input type="text" name="phone" placeholder="+998901234567" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600">
            </div>
            <div>
                <label class="block text-sm text-slate-600 mb-1">Telegram username</label>
                <input type="text" name="telegram" placeholder="@username" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
            <div>
                <label class="block text-sm text-slate-600 mb-1">E'lon rasmini yuklang</label>
                <input type="file" name="image" accept="image/*" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500">
            </div>
            <div>
                <label class="block text-sm text-slate-600 mb-1">To'lov cheki rasmini yuklang</label>
                <input type="file" name="receipt" accept="image/*" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
            </div>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg transition mt-4">E'lonni yuborish</button>
    </form>
</div>

<script>
    const categoriesData = {{ categories | tojson }};
    function updateSubcategories() {
        const catSelect = document.getElementById('categorySelect');
        const subSelect = document.getElementById('subcategorySelect');
        const selectedCat = catSelect.value;
        
        subSelect.innerHTML = '<option value="">Kichik bo\'limni tanlang</option>';
        if (selectedCat && categoriesData[selectedCat]) {
            categoriesData[selectedCat].forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = sub;
                subSelect.appendChild(opt);
            });
        }
    }
</script>
{% endblock %}
