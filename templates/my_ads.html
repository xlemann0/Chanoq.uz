{% extends 'base.html' %}
{% block content %}
<h2 class="text-2xl font-bold text-slate-900 mb-6">Mening E'lonlarim</h2>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for ad in ads %}
        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-md flex flex-col justify-between">
            <div>
                <img src="{{ url_for('static', filename='uploads/' + ad['image']) }}" alt="Ad" class="w-full h-48 object-cover">
                <div class="p-5">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full font-medium">{{ ad['status'] }}</span>
                        <span class="text-xs text-slate-500">{{ ad['region'] }}</span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-1">{{ ad['title'] }}</h3>
                    <p class="text-blue-600 font-bold mb-3">{{ ad['price'] }} so'm</p>
                    <p class="text-slate-600 text-sm mb-4 line-clamp-2">{{ ad['details'] }}</p>
                </div>
            </div>
            <div class="p-5 pt-0 border-t border-slate-100 mt-auto flex items-center justify-between">
                <a href="{{ url_for('edit_ad', id=ad['id']) }}" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg text-sm font-medium border border-blue-200 transition">Tahrirlash</a>
                <a href="{{ url_for('delete_ad', id=ad['id']) }}" onclick="return confirm('E\'lonni o\'chirmoqchimisiz?')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg text-sm font-medium border border-rose-200 transition">O'chirish</a>
            </div>
        </div>
    {% else %}
        <div class="col-span-full text-center py-16 text-slate-400">
            Siz hali e'lon joylamagansiz.
        </div>
    {% endfor %}
</div>
{% endblock %}
