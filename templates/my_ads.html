{% extends 'base.html' %}
{% block content %}
<h2 class="text-2xl font-bold text-white mb-6">Mening E'lonlarim</h2>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for ad in ads %}
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between">
            <div>
                <img src="{{ url_for('static', filename='uploads/' + ad['image']) }}" alt="Ad" class="w-full h-48 object-cover">
                <div class="p-5">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full">{{ ad['status'] }}</span>
                        <span class="text-xs text-slate-400">{{ ad['region'] }}</span>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1">{{ ad['title'] }}</h3>
                    <p class="text-blue-400 font-bold mb-3">{{ ad['price'] }} so'm</p>
                    <p class="text-slate-400 text-sm mb-4 line-clamp-2">{{ ad['details'] }}</p>
                </div>
            </div>
            <div class="p-5 pt-0 border-t border-slate-800/60 mt-auto flex items-center justify-between">
                <span class="text-xs text-slate-500">Holati: 
                    <strong class="{% if ad['status'] == 'Tasdiqlangan' %}text-emerald-400{% elif ad['status'] == 'Rad etilgan' %}text-rose-400{% else %}text-amber-400{% endif %}">{{ ad['status'] }}</strong>
                </span>
                <a href="{{ url_for('delete_ad', id=ad['id']) }}" onclick="return confirm('E\'lonni o\'chirmoqchimisiz?')" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 px-3 py-1.5 rounded-lg text-sm border border-rose-500/30 transition">O'chirish</a>
            </div>
        </div>
    {% else %}
        <div class="col-span-full text-center py-16 text-slate-500">
            Siz hali e'lon joylamagansiz.
        </div>
    {% endfor %}
</div>
{% endblock %}
